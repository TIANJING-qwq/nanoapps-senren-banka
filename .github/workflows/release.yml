name: Build VN app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            make
          python -m pip install Pillow pyelftools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the vn app (.hbapp)
        run: |
          chmod +x start
          ./start build vn
      - name: Package .nanoapp folder
        run: |
          python tools/build_apps.py vn
          ls -R /tmp/hbapps/Apps
          cd /tmp/hbapps && zip -r "$GITHUB_WORKSPACE/vn-nanoapp.zip" Apps
      - uses: actions/upload-artifact@v4
        with:
          name: vn-nanoapp
          path: vn-nanoapp.zip
          if-no-files-found: error
          retention-days: 14
